<html lang="en">
<head>

  <style>
    /* ============================================================
       PORTFOLIO STYLES (full, as built)
    ============================================================ */
    :root {
      --bg-page: #edece6;
      --bg-container: #f4f2ed;
      --text-primary: #1a1a1a;
      --text-secondary: #3a3a3a;
      --text-muted: #6a6a6a;
      --text-muted-light: #7a7a7a;
      --text-muted-lighter: #8a8a8a;
      --border-light: #d4d2cc;
      --border-medium: #ceccc6;
      --border-dark: #c2c0b8;
      --bg-hover: #eae8e2;
      --bg-metrics: #e2e0d8;
      --bg-metrics-hover: #d8d6ce;
      --shadow-color: rgba(0,0,0,0.04);
      --shadow-ios: rgba(0,0,0,0.06);
      --grain-opacity: 0.03;
      --modal-overlay: rgba(0,0,0,0.3);
      --radius-ios: 14px;
      --radius-card: 10px;
      --transition-ios: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    html { scroll-behavior: smooth; }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-page);
      color: var(--text-primary);
      padding: 1.5rem;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      font-weight: 400;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
      opacity: var(--grain-opacity);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 256px 256px;
    }

    /* ----- CONTAINER ----- */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: rgba(244, 242, 237, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 2.5rem 2.5rem 2rem;
      border: 1px solid rgba(212, 210, 204, 0.5);
      border-radius: var(--radius-ios);
      box-shadow: 0 4px 24px var(--shadow-color), 0 1px 2px rgba(0,0,0,0.02);
      position: relative;
      z-index: 1;
      overflow: hidden;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1), transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .container.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ----- NAV ----- */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border-light);
      margin-bottom: 3rem;
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 600;
      text-transform: lowercase;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      transition: color 0.2s ease;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    .contact-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.2s var(--transition-ios);
      font-family: 'Inter', sans-serif;
      padding: 0.3rem 0;
      border-bottom: 1px solid transparent;
    }

    .contact-btn:hover {
      color: var(--text-primary);
      transform: scale(1.02);
    }

    /* ----- HERO ----- */
    .hero {
      margin-bottom: 3rem;
    }

    .hero h1 {
      font-size: clamp(2.8rem, 6vw, 5rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin-bottom: 0.25rem;
      color: var(--text-primary);
      word-break: break-word;
    }

    .hero .title {
      font-size: 1.25rem;
      font-weight: 400;
      color: var(--text-secondary);
      letter-spacing: -0.01em;
      word-break: break-word;
    }

    /* ----- METHODOLOGY ----- */
    .methodology {
      margin: 2rem 0 2.5rem;
      padding: 2rem 0;
      border-top: 1px solid var(--border-light);
      border-bottom: 1px solid var(--border-light);
    }

    .methodology .label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted-lighter);
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .methodology p {
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.7;
      max-width: 680px;
      font-weight: 400;
    }

    .methodology p strong {
      color: var(--text-primary);
      font-weight: 500;
    }

    /* ----- PROCESS ----- */
    .process {
      margin: 2rem 0 2.5rem;
      padding: 2rem 0;
      border-top: 1px solid var(--border-light);
      border-bottom: 1px solid var(--border-light);
    }

    .process .process-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted-lighter);
      font-weight: 500;
      margin-bottom: 1rem;
    }

    .process-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
    }

    .process-step {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 0.75rem 0.25rem;
      border-left: 2px solid var(--border-light);
      padding-left: 1rem;
      transition: border-color 0.2s ease;
    }

    .process-step:hover {
      border-left-color: var(--text-primary);
    }

    .process-step .step-number {
      font-size: 0.6rem;
      font-weight: 500;
      color: var(--text-muted-lighter);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.2rem;
    }

    .process-step h4 {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 0.2rem;
    }

    .process-step p {
      font-size: 0.75rem;
      color: var(--text-muted-light);
      line-height: 1.5;
      font-weight: 400;
      max-width: 220px;
    }

    /* ----- TRUST METRICS ----- */
    .trust-metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem 2.5rem;
      margin: 1.5rem 0 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-light);
    }

    .trust-metrics .item {
      display: flex;
      align-items: baseline;
      gap: 0.35rem;
      font-size: 0.8rem;
      color: var(--text-muted-lighter);
      font-weight: 400;
    }

    .trust-metrics .item .number {
